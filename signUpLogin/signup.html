<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MusicWave</title>
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
  <!-- Toast Container for alerts -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-container">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo-wrapper">
        <div class="logo-bar"></div>
        <div class="logo-bar"></div>
        <div class="logo-bar"></div>
        <div class="logo-bar"></div>
        <div class="logo-bar"></div>
        <span class="logo-text">MusicWave</span>
      </div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Get started with a free MusicWave account</p>
    </div>

    <!-- Registration Form -->
    <form id="signupForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="text" id="name" name="name" class="form-input" placeholder=" " required autocomplete="name">
          <label for="name" class="form-label">Full Name</label>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="email" id="email" name="email" class="form-input" placeholder=" " required autocomplete="email">
          <label for="email" class="form-label">Email address</label>
          <div class="input-status-icon" id="emailStatusIcon"></div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-input" placeholder=" " required autocomplete="new-password">
          <label for="password" class="form-label">Password</label>
        </div>
        
        <!-- Password Strength Checklist & Bar -->
        <div class="strength-container">
          <div class="strength-bar-wrapper">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <ul class="strength-checklist">
            <li class="checklist-item unmet" id="chkLength">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="chk-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
              At least 8 chars
            </li>
            <li class="checklist-item unmet" id="chkNumber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="chk-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
              At least 1 number
            </li>
            <li class="checklist-item unmet" id="chkUpper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="chk-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
              1 uppercase char
            </li>
            <li class="checklist-item unmet" id="chkSpecial">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="chk-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
              1 special char
            </li>
          </ul>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="btnSubmit">
        <span id="btnText">Create Account</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>
    </form>

    <div class="divider">or</div>

    <!-- Social Logins -->
    <div class="social-buttons">
      <button class="btn-social" onclick="showToast('info', 'Google Sign-Up coming soon!')">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>
      <button class="btn-social" onclick="showToast('info', 'GitHub Sign-Up coming soon!')">
        <svg viewBox="0 0 24 24" fill="currentColor" style="color: #fff;">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        Sign up with GitHub
      </button>
    </div>

    <!-- Redirect Link -->
    <div class="redirect-wrapper">
      Already have an account? <a href="login.html" class="redirect-link">Log In</a>
    </div>
  </div>

  <script>
    // Toast alerts helper
    function showToast(type, message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = document.createElement('div');
      icon.className = 'toast-icon';
      icon.innerHTML = type === 'success' ? '✓' : (type === 'error' ? '✕' : 'ℹ');
      
      const text = document.createElement('div');
      text.className = 'toast-message';
      text.textContent = message;
      
      toast.appendChild(icon);
      toast.appendChild(text);
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    // Check for parameter error messages in URL
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        showToast('error', decodeURIComponent(params.get('error')));
      }
    });

    // Inputs & regex validators
    const emailInput = document.getElementById('email');
    const emailStatus = document.getElementById('emailStatusIcon');
    const passwordInput = document.getElementById('password');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Real-time email validation
    emailInput.addEventListener('input', () => {
      const val = emailInput.value.trim();
      if (val === '') {
        emailStatus.innerHTML = '';
        emailStatus.className = 'input-status-icon';
      } else if (emailRegex.test(val)) {
        emailStatus.innerHTML = '✓';
        emailStatus.className = 'input-status-icon valid';
      } else {
        emailStatus.innerHTML = '✕';
        emailStatus.className = 'input-status-icon invalid';
      }
    });

    // Password strength logic
    const strengthBar = document.getElementById('strengthBar');
    const chkLength = document.getElementById('chkLength');
    const chkNumber = document.getElementById('chkNumber');
    const chkUpper = document.getElementById('chkUpper');
    const chkSpecial = document.getElementById('chkSpecial');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      
      // Enforce criteria checks
      const hasLength = val.length >= 8;
      const hasNumber = /\d/.test(val);
      const hasUpper = /[A-Z]/.test(val);
      const hasSpecial = /[^A-Za-z0-9]/.test(val);

      // Checklist item Met/Unmet updates
      updateChecklistItem(chkLength, hasLength);
      updateChecklistItem(chkNumber, hasNumber);
      updateChecklistItem(chkUpper, hasUpper);
      updateChecklistItem(chkSpecial, hasSpecial);

      // Enforce strength calculation
      let score = 0;
      if (val.length > 0) {
        if (hasLength) score++;
        if (hasNumber) score++;
        if (hasUpper) score++;
        if (hasSpecial) score++;
      }

      // Modify strength bar visuals
      strengthBar.className = 'strength-bar';
      if (score === 0) {
        strengthBar.style.width = '0%';
      } else if (score === 1 || score === 2) {
        strengthBar.classList.add('weak');
        strengthBar.style.width = '25%';
      } else if (score === 3) {
        strengthBar.classList.add('fair');
        strengthBar.style.width = '60%';
      } else if (score === 4) {
        strengthBar.classList.add('strong');
        strengthBar.style.width = '100%';
      }
    });

    function updateChecklistItem(item, isMet) {
      if (isMet) {
        item.classList.remove('unmet');
        item.classList.add('met');
      } else {
        item.classList.remove('met');
        item.classList.add('unmet');
      }
    }

    // Signup form submit handler
    const signupForm = document.getElementById('signupForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validation
      if (!name) {
        showToast('error', 'Please enter your full name.');
        document.getElementById('name').focus();
        return;
      }
      if (!email) {
        showToast('error', 'Please enter your email address.');
        emailInput.focus();
        return;
      }
      if (!emailRegex.test(email)) {
        showToast('error', 'Please enter a valid email address.');
        emailInput.focus();
        return;
      }
      if (!password) {
        showToast('error', 'Please enter a password.');
        passwordInput.focus();
        return;
      }

      // Password requirement checklist checks
      const hasLength = password.length >= 8;
      const hasNumber = /\d/.test(password);
      const hasUpper = /[A-Z]/.test(password);
      const hasSpecial = /[^A-Za-z0-9]/.test(password);

      if (!hasLength || !hasNumber || !hasUpper || !hasSpecial) {
        showToast('error', 'Please ensure your password meets all strength criteria.');
        passwordInput.focus();
        return;
      }

      // Enter loading state
      btnSubmit.disabled = true;
      btnText.style.opacity = '0';
      btnSpinner.style.display = 'block';

      try {
        const formData = new FormData();
        formData.append('name', name);
        formData.append('email', email);
        formData.append('password', password);

        const response = await fetch('processSignUp.php', {
          method: 'POST',
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: formData
        });

        if (!response.ok) {
          throw new Error('Network response was not OK');
        }

        const result = await response.json();

        if (result.success) {
          showToast('success', result.message || 'Account created successfully!');
          // Redirect on success
          setTimeout(() => {
            window.location.href = result.redirect || 'login.html?signup=success';
          }, 1500);
        } else {
          showToast('error', result.message || 'Registration failed.');
          // Exit loading state
          btnSubmit.disabled = false;
          btnText.style.opacity = '1';
          btnSpinner.style.display = 'none';
        }
      } catch (err) {
        showToast('error', 'A server error occurred. Please try again.');
        // Exit loading state
        btnSubmit.disabled = false;
        btnText.style.opacity = '1';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
